name: Build FontStudio.exe
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_engine.py
        continue-on-error: true
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FontStudio --collect-submodules fontTools --hidden-import brotli fontstudio.py
      - uses: actions/upload-artifact@v4
        with: { name: FontStudio-exe, path: dist/FontStudio.exe }
